<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yeni Şifre Belirle // Salih Taşkın</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#060a09">
</head>
<body class="guest-redirect-page">

<canvas id="matrix-canvas"></canvas>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">S.T <span>// CyberSec</span></a>
    <div class="nav-actions">
      <div class="lang-toggle">
        <button data-lang="tr">TR</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="theme-toggle" id="theme-toggle-btn" aria-label="tema degistir" title="Tema degistir">🌙</button>
    </div>
  </div>
</nav>

<div class="login-wrap">
  <div class="login-box">
    <div class="top"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
    <h2 data-i18n="reset.title">Yeni Şifre Belirle</h2>
    <div class="sub" data-i18n="reset.sub">Hesabın için yeni bir şifre gir</div>

    <form id="reset-form">
      <div class="field">
        <label data-i18n="reset.new_pass_label">Yeni Şifre</label>
        <input type="password" id="new-password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label data-i18n="reset.confirm_pass_label">Yeni Şifre (Tekrar)</label>
        <input type="password" id="confirm-password" autocomplete="new-password" required>
      </div>
      <div class="login-msg" id="reset-msg"></div>
      <button type="submit" class="btn" id="reset-submit" style="width:100%;justify-content:center;" data-i18n="reset.btn">Şifreyi Sıfırla</button>
    </form>

    <a href="login.html" class="back-link" data-i18n="forgot.back_to_login">← Girişe dön</a>
  </div>
</div>

<script src="js/translations.js"></script>
<script src="js/main.js"></script>
<script src="js/session-ui.js"></script>
<script src="js/password-recovery.js"></script>
</body>
</html>
