</head>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html#home" class="logo">S.T <span>// CyberSec</span></a>
    <ul class="nav-links">
      <li><a href="index.html#home" data-i18n="nav.home">Ana Sayfa</a></li>
      <li><a href="index.html#about" data-i18n="nav.about">Hakkımda</a></li>
      <li><a href="index.html#projects" data-i18n="nav.projects">Projeler</a></li>
      <li><a href="blog.html" data-i18n="nav.blog">Blog</a></li>
      <li><a href="index.html#contact" data-i18n="nav.contact">İletişim</a></li>
      <li data-auth="guest-only"><a href="register.html" data-i18n="nav.register">Kayıt Ol</a></li>
      <li data-auth="guest-only"><a href="login.html" data-i18n="nav.login">Giriş Yap</a></li>
      <li data-auth="user-only" style="display:none;"><a href="dashboard.html" data-i18n="nav.dashboard">Panele Git</a></li>
      <li data-auth="user-only" style="display:none;"><a href="#" id="nav-logout-btn" data-i18n="dash.logout">Çıkış Yap</a></li>
    </ul>
    <div class="nav-actions">
      <div class="lang-toggle">
        <button data-lang="tr">TR</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="theme-toggle" id="theme-toggle-btn" aria-label="tema degistir" title="Tema degistir">🌙</button>
      <button class="nav-toggle" aria-label="menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<section class="section" style="border-bottom:none;padding-top:140px;">
  <div class="container">
    <div class="blog-toolbar">
      <div>
        <h2 class="section-title" data-i18n="blog.page_title">Blog</h2>
        <div class="section-sub" data-i18n="blog.page_sub">cat posts/*.md</div>
      </div>
      <a href="/feed.xml" class="rss-link" data-i18n="blog.rss_link" target="_blank" rel="noopener">RSS Aboneliği</a>
    </div>
    <div id="tag-filter-bar" class="tag-filter-bar"></div>
    <div id="blog-list" class="cards-grid" style="margin-top:10px;"></div>

    <div class="subscribe-box">
      <h4 data-i18n="blog.subscribe_title">Yeni yazılardan haberdar ol</h4>
      <form id="subscribe-form" class="subscribe-form" style="margin-top:14px;">
        <input type="email" id="subscribe-email" data-i18n-placeholder="blog.subscribe_placeholder" placeholder="E-posta adresin" required>
        <input type="text" id="subscribe-website" name="website" class="hp-field" autocomplete="off" tabindex="-1">
        <button type="submit" class="btn" data-i18n="blog.subscribe_btn">Abone Ol</button>
      </form>
      <div class="subscribe-msg" id="subscribe-msg"></div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div>© <span id="year"></span> Salih Taşkın — <span data-i18n="footer.text">Tüm hakları saklıdır.</span></div>
    <div class="made" data-i18n="footer.made">Cloudflare Pages üzerinde barındırılıyor.</div>
  </div>
</footer>

<script src="js/translations.js"></script>
<script src="js/main.js"></script>
<script src="js/session-ui.js"></script>
<script src="js/blog.js"></script>

</body>
</html>
